<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BSK KING</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root {
    --royal: #0b2a7a;
    --royal-deep: #061847;
    --gold: #ffd21f;
    --gold-dark: #e09a00;
    --caramel: #b8620f;
    --caramel-dark: #6b3206;
    --cream: #fff7e6;
    --wafer: #e8b25a;
    --red: #d7141a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 35%, #1f4fc9 0%, var(--royal) 45%, var(--royal-deep) 100%);
    color: var(--cream);
    font-family: 'Lilita One', system-ui, sans-serif;
    overflow-x: hidden;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .rays {
    position: fixed; inset: -50%;
    background: repeating-conic-gradient(from 0deg, rgba(255,210,31,.10) 0deg 8deg, transparent 8deg 20deg);
    animation: spin 40s linear infinite;
    z-index: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  main {
    position: relative; z-index: 2;
    flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 48px 16px 24px;
    width: 100%;
    text-align: center;
  }

  .crown {
    width: min(220px, 50vw);
    filter: drop-shadow(0 8px 0 var(--caramel-dark)) drop-shadow(0 18px 30px rgba(0,0,0,.5));
    animation: bob 3s ease-in-out infinite;
  }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-14px) rotate(4deg); } }

  .logo {
    position: relative;
    margin-top: -10px;
    transform: rotate(-6deg);
  }
  .logo h1 {
    font-size: clamp(72px, 20vw, 240px);
    line-height: .85;
    letter-spacing: .02em;
    background: linear-gradient(180deg, #fff6b0 0%, var(--gold) 40%, var(--gold-dark) 100%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    -webkit-text-stroke: clamp(3px, .8vw, 8px) var(--caramel-dark);
    paint-order: stroke fill;
    filter: drop-shadow(0 clamp(6px,1.4vw,14px) 0 var(--caramel-dark)) drop-shadow(0 20px 30px rgba(0,0,0,.55));
    position: relative;
  }
  .logo h1 span { display: inline-block; animation: pop 2.4s ease-in-out infinite; }
  .logo h1 span:nth-child(2) { animation-delay: .1s; }
  .logo h1 span:nth-child(3) { animation-delay: .2s; }
  .logo h1 span:nth-child(5) { animation-delay: .35s; }
  .logo h1 span:nth-child(6) { animation-delay: .45s; }
  .logo h1 span:nth-child(7) { animation-delay: .55s; }
  .logo h1 span:nth-child(8) { animation-delay: .65s; }
  @keyframes pop { 0%,80%,100% { transform: translateY(0) scale(1); } 88% { transform: translateY(-10%) scale(1.08); } }

  .shine {
    position: absolute; inset: 0;
    background: linear-gradient(110deg, transparent 35%, rgba(255,255,255,.85) 50%, transparent 65%);
    background-size: 250% 100%;
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    font-size: clamp(72px, 20vw, 240px);
    line-height: .85;
    letter-spacing: .02em;
    animation: shine 3.5s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes shine { 0% { background-position: 150% 0; } 60%,100% { background-position: -100% 0; } }

  .ribbon {
    display: inline-block;
    margin-top: clamp(18px, 4vw, 36px);
    background: var(--red);
    color: #fff;
    font-family: 'Pacifico', cursive;
    font-size: clamp(20px, 5vw, 40px);
    padding: 6px 36px 12px;
    transform: rotate(-3deg);
    box-shadow: 0 6px 0 #7d0a0d, 0 14px 24px rgba(0,0,0,.4);
    clip-path: polygon(0 0, 100% 0, 96% 50%, 100% 100%, 0 100%, 4% 50%);
  }

  .bar {
    position: relative;
    margin-top: clamp(32px, 7vw, 64px);
    width: min(640px, 100%);
    height: clamp(90px, 18vw, 140px);
    border-radius: 18px;
    overflow: hidden;
    transform: rotate(2deg);
    box-shadow: 0 10px 0 var(--caramel-dark), 0 24px 40px rgba(0,0,0,.5);
    background:
      linear-gradient(180deg,
        var(--wafer) 0 18%,
        var(--cream) 18% 34%,
        var(--caramel) 34% 52%,
        var(--cream) 52% 68%,
        var(--wafer) 68% 100%);
  }
  .bar::before {
    content: ""; position: absolute; inset: 0;
    background:
      repeating-linear-gradient(90deg, rgba(107,50,6,.35) 0 2px, transparent 2px 22px),
      repeating-linear-gradient(0deg, rgba(107,50,6,.25) 0 2px, transparent 2px 10px);
    mask: linear-gradient(180deg, #000 0 18%, transparent 18% 68%, #000 68% 100%);
  }
  .bar::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.35) 45%, transparent 60%);
    background-size: 300% 100%;
    animation: shine 4s ease-in-out infinite;
  }
  .drip {
    position: absolute; top: 34%;
    width: 22px; border-radius: 0 0 11px 11px;
    background: var(--caramel);
    animation: drip 3s ease-in infinite;
  }
  @keyframes drip { 0% { height: 0; } 70% { height: 46%; } 100% { height: 46%; opacity: 0; } }

  .tagline {
    margin-top: clamp(28px, 6vw, 48px);
    font-size: clamp(18px, 4vw, 28px);
    color: var(--gold);
    text-shadow: 0 3px 0 var(--royal-deep);
    letter-spacing: .08em;
    text-transform: uppercase;
  }

  .nut {
    position: fixed; top: -60px; z-index: 1;
    font-size: 28px;
    animation: fall linear infinite;
    pointer-events: none;
  }
  @keyframes fall { to { transform: translateY(115vh) rotate(720deg); } }

  footer {
    position: relative; z-index: 2;
    padding: 16px;
    color: rgba(255,247,230,.6);
    font-size: 14px;
    letter-spacing: .1em;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
  }
</style>
</head>
<body>
  <div class="rays"></div>
  <main>
    <svg class="crown" viewBox="0 0 200 140" aria-hidden="true">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fff6b0"/>
          <stop offset=".5" stop-color="#ffd21f"/>
          <stop offset="1" stop-color="#e09a00"/>
        </linearGradient>
      </defs>
      <path d="M15 120 L5 30 L55 75 L100 10 L145 75 L195 30 L185 120 Z" fill="url(#g)" stroke="#6b3206" stroke-width="7" stroke-linejoin="round"/>
      <rect x="15" y="112" width="170" height="22" rx="6" fill="url(#g)" stroke="#6b3206" stroke-width="7"/>
      <circle cx="5" cy="30" r="10" fill="#d7141a" stroke="#6b3206" stroke-width="5"/>
      <circle cx="100" cy="10" r="10" fill="#d7141a" stroke="#6b3206" stroke-width="5"/>
      <circle cx="195" cy="30" r="10" fill="#d7141a" stroke="#6b3206" stroke-width="5"/>
      <circle cx="60" cy="123" r="5" fill="#0b2a7a"/>
      <circle cx="100" cy="123" r="5" fill="#d7141a"/>
      <circle cx="140" cy="123" r="5" fill="#0b2a7a"/>
    </svg>

    <div class="logo">
      <h1 aria-label="BSK KING"><span>B</span><span>S</span><span>K</span> <span>K</span><span>I</span><span>N</span><span>G</span></h1>
    </div>

    <div class="ribbon">der König der Snacks</div>

    <div class="bar" id="bar" aria-hidden="true"></div>

    <p class="tagline">Knusprig · Karamell · Königlich</p>
  </main>
  <footer>👑 LONG LIVE THE KING 👑</footer>

<script>
  const bar = document.getElementById('bar');
  [12, 30, 51, 68, 86].forEach((left, i) => {
    const d = document.createElement('div');
    d.className = 'drip';
    d.style.left = left + '%';
    d.style.animationDelay = (i * 0.6) + 's';
    bar.appendChild(d);
  });

  const items = ['🌰', '👑', '🍫', '✨', '🥜'];
  for (let i = 0; i < 22; i++) {
    const n = document.createElement('div');
    n.className = 'nut';
    n.textContent = items[i % items.length];
    n.style.left = Math.random() * 100 + 'vw';
    n.style.fontSize = 18 + Math.random() * 26 + 'px';
    n.style.animationDuration = 6 + Math.random() * 8 + 's';
    n.style.animationDelay = -Math.random() * 14 + 's';
    document.body.appendChild(n);
  }
</script>
</body>
</html>
